name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch supersedes the first: cancel the older run
# rather than paying for a verdict on a commit nobody will look at. `main` is
# excluded so every commit on the default branch keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Bun, not npm, and this is forced rather than preferred.
      #
      # `npm install` cannot resolve this dependency tree at all:
      # @hookform/resolvers@5.5.1 declares a peerOptional on valibot@^1.0.0
      # while @typeschema/valibot@0.14.0 pins valibot@^0.39.0, and npm's strict
      # peer resolution fails with ERESOLVE. Bun's resolver accepts it, which is
      # why local installs and the Lovable build have always worked.
      #
      # `--legacy-peer-deps` would silence it, but that only tells npm to stop
      # checking — and it would still resolve semver ranges fresh on every run,
      # because the repo commits bun.lock and deliberately does not track
      # package-lock.json (see the note in vercel.json).
      #
      # Using bun with the committed lockfile fixes both halves: the install
      # succeeds, and it is byte-reproducible instead of drifting whenever a
      # transitive dependency publishes. `--frozen-lockfile` makes an
      # out-of-date bun.lock a CI failure rather than a silent update.
      #
      # The `npm run` steps below are unaffected: bun installs a standard
      # node_modules layout, and every script is a plain node binary.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ordered cheapest-signal-first: a type error or a lint error is far more
      # common than a permission drift or a failing assertion, and each step
      # below is only meaningful if the ones above it passed. Every step runs
      # the same script a developer runs locally (`npm run ci`), so there is one
      # definition of "green" rather than two.
      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      # Guards the one invariant neither the compiler nor the tests can see:
      # that public.has_permission() in SQL and src/lib/permissions.ts still
      # describe the same permission sets. They are enforced in different
      # processes, so drift between them is invisible until someone is granted
      # or refused the wrong thing in production.
      - name: Permission parity (SQL ↔ TypeScript)
        run: npm run check:permissions

      - name: Tests
        run: npm test
